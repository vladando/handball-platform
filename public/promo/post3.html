<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #090909; font-family: 'Barlow Condensed', sans-serif; }

  .wrap {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 72px 90px;
    position: relative; overflow: hidden;
  }

  /* Diagonal accent */
  .diag {
    position: absolute;
    top: -100px; right: -100px;
    width: 600px; height: 600px;
    background: rgba(232,255,71,0.05);
    transform: rotate(45deg);
    border-radius: 40px;
  }
  .diag2 {
    position: absolute;
    bottom: -150px; left: -100px;
    width: 400px; height: 400px;
    background: rgba(232,255,71,0.03);
    transform: rotate(30deg);
    border-radius: 40px;
  }

  .header {
    display: flex; justify-content: space-between; align-items: flex-start;
    position: relative;
  }
  .logo { font-weight: 900; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: #f5f3ee; }
  .logo span { color: #e8ff47; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #e8ff47;
    text-align: right;
  }

  .center { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; }

  h2 {
    font-weight: 900; font-size: 80px;
    text-transform: uppercase; color: #f5f3ee;
    line-height: 0.9; letter-spacing: -0.01em;
    margin-bottom: 56px;
  }
  h2 em { color: #e8ff47; font-style: normal; display: block; }

  /* Stats grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 52px;
  }
  .stat-box {
    background: #111111;
    border: 1px solid rgba(245,243,238,0.1);
    border-radius: 10px;
    padding: 32px 28px;
    position: relative;
    overflow: hidden;
  }
  .stat-box::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #e8ff47, transparent);
  }
  .stat-num {
    font-weight: 900; font-size: 72px;
    color: #e8ff47; line-height: 1;
    letter-spacing: -0.02em; margin-bottom: 8px;
  }
  .stat-unit {
    font-size: 32px; color: rgba(232,255,71,0.5);
  }
  .stat-desc {
    font-family: 'Barlow', sans-serif;
    font-size: 16px; color: rgba(245,243,238,0.5);
    text-transform: none; font-weight: 400;
    line-height: 1.3;
  }

  .sub {
    font-family: 'Barlow', sans-serif;
    font-size: 20px; color: rgba(245,243,238,0.5);
    line-height: 1.6; max-width: 600px;
  }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    position: relative;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    background: #e8ff47; color: #090909;
    font-weight: 800; font-size: 20px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 18px 36px; border-radius: 4px;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; color: rgba(245,243,238,0.25);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="diag"></div>
  <div class="diag2"></div>

  <div class="header">
    <div class="logo">Handball<span>Hub</span></div>
    <div class="eyebrow">The Network<br>Is Growing</div>
  </div>

  <div class="center">
    <h2>Real Numbers.<br><em>Real Clubs.</em></h2>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-num">500<span class="stat-unit">+</span></div>
        <div class="stat-desc">Players already registered</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">50<span class="stat-unit">+</span></div>
        <div class="stat-desc">Verified clubs searching</div>
      </div>
      <div class="stat-box">
        <div class="stat-num">12<span class="stat-unit">+</span></div>
        <div class="stat-desc">Countries represented</div>
      </div>
    </div>

    <p class="sub">Verified clubs are actively searching right now. The question is — can they find you?</p>
  </div>

  <div class="footer">
    <div class="cta">Join Now — It's Free →</div>
    <div class="url">handballhub.net</div>
  </div>
</div>
</body>
</html>

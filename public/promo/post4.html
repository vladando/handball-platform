<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #090909; font-family: 'Barlow Condensed', sans-serif; }

  .wrap {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 72px 90px;
    position: relative; overflow: hidden;
  }

  /* Full-width yellow stripe */
  .stripe {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 200px;
    background: #e8ff47;
    transform: translateY(-50%) skewY(-2deg);
    z-index: 0;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 2;
  }
  .logo { font-weight: 900; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: #f5f3ee; }
  .logo span { color: #e8ff47; }
  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #6b6b6b;
    border: 1px solid rgba(245,243,238,0.15);
    padding: 6px 14px; border-radius: 2px;
  }

  .main {
    flex: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    position: relative; z-index: 2;
  }

  .above-stripe {
    font-weight: 900; font-size: 86px;
    text-transform: uppercase; color: #f5f3ee;
    line-height: 0.95; letter-spacing: -0.01em;
    margin-bottom: 20px;
  }

  .on-stripe {
    font-weight: 900; font-size: 100px;
    text-transform: uppercase; color: #090909;
    line-height: 0.95; letter-spacing: -0.01em;
    position: relative; z-index: 3;
    margin-bottom: 20px;
    padding: 16px 0;
  }

  .below-stripe {
    font-weight: 900; font-size: 86px;
    text-transform: uppercase; color: #f5f3ee;
    line-height: 0.95; letter-spacing: -0.01em;
  }

  .checklist {
    margin-top: 52px;
    display: flex; flex-direction: column; gap: 16px;
    position: relative; z-index: 2;
  }
  .check-item {
    display: flex; align-items: center; gap: 16px;
    font-family: 'Barlow', sans-serif;
    font-size: 20px; color: rgba(245,243,238,0.7);
  }
  .check-icon {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(232,255,71,0.15);
    border: 1px solid #e8ff47;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #e8ff47; flex-shrink: 0;
  }

  .footer {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 2;
  }
  .cta {
    display: inline-flex; align-items: center; gap: 12px;
    background: #e8ff47; color: #090909;
    font-weight: 800; font-size: 20px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 18px 36px; border-radius: 4px;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px; color: rgba(245,243,238,0.25);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stripe"></div>

  <div class="header">
    <div class="logo">Handball<span>Hub</span></div>
    <div class="tag">// Stop Waiting</div>
  </div>

  <div class="main">
    <div class="above-stripe">Still Waiting</div>
    <div class="on-stripe">For A Club?</div>
    <div class="below-stripe">Stop. Start Now.</div>

    <div class="checklist">
      <div class="check-item"><div class="check-icon">✓</div>Free player registration</div>
      <div class="check-item"><div class="check-icon">✓</div>Profile seen by verified clubs</div>
      <div class="check-item"><div class="check-icon">✓</div>Direct contact when a club is interested</div>
    </div>
  </div>

  <div class="footer">
    <div class="cta">Register Free →</div>
    <div class="url">handballhub.net</div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; background: #090909; font-family: 'Barlow Condensed', sans-serif; }

  .wrap {
    width: 1080px; height: 1080px;
    display: flex; flex-direction: column;
    justify-content: center; align-items: flex-start;
    padding: 90px 96px;
    position: relative;
    overflow: hidden;
  }

  /* Background grid lines */
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.04) 1px, transparent 1px);
    background-size: 80px 80px;
  }

  /* Top accent corner */
  .corner-accent {
    position: absolute; top: 0; right: 0;
    width: 320px; height: 320px;
    background: radial-gradient(circle at top right, rgba(232,255,71,0.12) 0%, transparent 70%);
  }

  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 28px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #f5f3ee; margin-bottom: 80px;
    position: relative;
  }
  .logo span { color: #e8ff47; }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #e8ff47;
    margin-bottom: 28px; position: relative;
  }

  h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 108px;
    line-height: 0.95; text-transform: uppercase;
    color: #f5f3ee; margin-bottom: 40px;
    position: relative; max-width: 820px;
    letter-spacing: -0.01em;
  }
  h1 em { color: #e8ff47; font-style: normal; }

  .divider {
    width: 80px; height: 4px;
    background: #e8ff47; margin-bottom: 36px;
    position: relative;
  }

  .subtitle {
    font-family: 'Barlow', sans-serif;
    font-weight: 400; font-size: 22px;
    color: rgba(245,243,238,0.6); line-height: 1.6;
    max-width: 540px; margin-bottom: 64px;
    position: relative;
  }

  .cta {
    display: inline-flex; align-items: center; gap: 14px;
    background: #e8ff47; color: #090909;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 22px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 20px 40px; border-radius: 4px;
    position: relative;
  }

  .url {
    position: absolute; bottom: 60px; right: 90px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; color: rgba(245,243,238,0.3);
    letter-spacing: 0.08em;
  }

  /* Number decoration */
  .big-number {
    position: absolute; right: 80px; top: 50%;
    transform: translateY(-50%);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900; font-size: 400px;
    color: rgba(232,255,71,0.04);
    line-height: 1; user-select: none;
    letter-spacing: -0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="grid-bg"></div>
  <div class="corner-accent"></div>
  <div class="big-number">1</div>

  <div class="logo">Handball<span>Hub</span></div>

  <div class="tag">// For Players</div>

  <h1>Your Next<br>Club Is<br><em>Looking</em><br>For You.</h1>

  <div class="divider"></div>

  <p class="subtitle">The platform where handball careers are built. Create your profile and get discovered by professional clubs.</p>

  <div class="cta">Register Free → handballhub.net</div>

  <div class="url">handballhub.net</div>
</div>
</body>
</html>
